name: Fetch reference Shorts (temporary)

# Temporary research helper: downloads 20 public Shorts for local style analysis
# and commits them back to this branch. Runs only on this branch; remove after use.
on:
  push:
    branches: [claude/focused-hypatia-mlf6u2]
    paths: [.github/workflows/fetch-ricksclips.yml]

permissions:
  contents: write

concurrency:
  group: fetch-ricksclips
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download Shorts
        run: |
          mkdir -p research/ricksclips
          cd research/ricksclips
          ids="aD73kaL_PtY TRUkQ1wbV2E i4hYq1oSXTg e9NoHjAXYIY QlDPMzGmYac HxqtHI62otM 7xS87iActkU Mz72MuPgnGY 5WMQhPObNqQ ZDy3xXA2iHk LC8hYwUZ-kU t3OXkhlI6NQ DEe0iKH4KIw GM9UKnZ6JFw VKsamN3Fk4U 0m6G8pDtzNs nzbkkEZFM8g VS1Z_Q-Klt8 lnYLIWP2l-I jpFJ8Z_F-qU"
          : > download.log
          for id in $ids; do
            for client in default tv_simply web_safari mweb; do
              args=(--js-runtimes node --no-progress --write-info-json --write-auto-subs --write-subs
                    --sub-langs "en.*" --sub-format vtt --convert-subs vtt
                    -f "bv*[height<=1920][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b"
                    --merge-output-format mp4 -o "%(id)s.%(ext)s")
              [ "$client" != default ] && args+=(--extractor-args "youtube:player_client=$client")
              if yt-dlp "${args[@]}" "https://www.youtube.com/shorts/$id" >>download.log 2>&1 && [ -f "$id.mp4" ]; then
                echo "OK $id ($client)" | tee -a status.txt; break
              fi
              echo "FAIL $id ($client)" | tee -a status.txt
            done
          done
          ls -la
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ricksclips
          git commit -m "research: fetched reference Shorts (temporary)" || exit 0
          git push
